name: kodama echo

# A quiet forest spirit for your repo — cuts through noise, echoes back signal.
# Copy this file into your repository to get a BLUF-first echo on every PR.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  echo:
    name: Echo actionable signals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: kodama echo (summary)
        id: echo
        uses: levmichael3/kodama@v1
        with:
          mode: summary

      - name: Post echo as PR comment
        if: steps.echo.outputs.echo != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${{ steps.echo.outputs.echo }}`,
            });
