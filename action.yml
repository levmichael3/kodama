name: "kodama echo"
description: "A quiet forest spirit for your repo — cuts through noise, echoes back actionable signals."
author: "levmichael3"

branding:
  icon: "activity"
  color: "green"

inputs:
  mode:
    description: "What to echo back: summary, review, or calm. Defaults to summary."
    required: false
    default: "summary"
  context:
    description: "Extra context to include in the echo (e.g. recent decisions, SLOs, on-call notes)."
    required: false
    default: ""
  max_files:
    description: "Maximum number of changed files to read for signal extraction."
    required: false
    default: "20"
  base_sha:
    description: "Base commit SHA for the diff. Defaults to the PR base on pull_request events; set explicitly for push or other events."
    required: false
    default: ""

outputs:
  echo:
    description: "The echoed signal — BLUF-first, zero-bloat, facts verbatim."

runs:
  using: "composite"
  steps:
    - name: Echo the forest back
      shell: bash
      env:
        KODAMA_MODE: ${{ inputs.mode }}
        KODAMA_CONTEXT: ${{ inputs.context }}
        KODAMA_MAX_FILES: ${{ inputs.max_files }}
        GITHUB_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
      run: |
        "${{ github.action_path }}/echo.sh"
